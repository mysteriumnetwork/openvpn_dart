name: openvpn_dart
description: "Cross-platform OpenVPN client for Flutter — Android (ics-openvpn), iOS/macOS (NetworkExtension) and Windows (bundled binaries), with status streaming and live traffic stats."
version: 0.0.1
homepage: https://github.com/mysteriumnetwork/openvpn_dart
repository: https://github.com/mysteriumnetwork/openvpn_dart

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: 3.44.7

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mysteriumvpn.openvpn_dart
        pluginClass: OpenvpnDartPlugin
      ios:
        pluginClass: OpenvpnDartPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: OpenvpnDartPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: OpenvpnDartPluginCApi
        fileName: openvpn_dart_plugin.cpp
