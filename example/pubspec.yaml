name: openvpn_dart_example
version: 1.0.0+1
description: "Demonstrates how to use the openvpn_dart plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: 3.44.7

dependencies:
  flutter:
    sdk: flutter

  openvpn_dart:
    path: ../

  # Example-only: request the Android 13+ POST_NOTIFICATIONS runtime permission so the
  # VPN foreground notification is shown.
  permission_handler: 12.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
