group = "com.mysteriumvpn.openvpn_dart"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.mysteriumvpn.openvpn_dart"

    compileSdk = 35

    // Match the bundled ics-openvpn AAR (built with Java 17).
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }

    // Native .so (OpenVPN engine) packaging — ensure the loader finds the libs.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

repositories {
    // Local Maven repo holding the ics-openvpn AAR built from source.
    // See android/localmaven/PROVENANCE.md. Consuming apps must also expose this repo
    // (the example app does so in its root build.gradle.kts) until it is published to a
    // shared Maven (CI). A library module cannot use a files()/flatDir .aar dependency.
    maven { url = uri("${projectDir}/localmaven") }
}

dependencies {
    // ics-openvpn backend (OpenVPN engine + native libs), built from source.
    implementation "network.mysterium.openvpn:icsopenvpn:0.7.55-myst"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
